<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Apex Catalyst Logo - Crystal/Diamond shape inspired by nature -->
  <defs>
    <linearGradient id="forest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A2F"/>
      <stop offset="100%" style="stop-color:#2D4F3F"/>
    </linearGradient>
    <linearGradient id="terra" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4654A"/>
      <stop offset="100%" style="stop-color:#D4856A"/>
    </linearGradient>
  </defs>
  
  <!-- Main diamond shape -->
  <path d="M16 2 L28 16 L16 30 L4 16 Z" fill="url(#forest)"/>
  
  <!-- Inner accent -->
  <path d="M16 8 L22 16 L16 24 L10 16 Z" fill="url(#terra)" opacity="0.9"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#F5F0E8"/>
</svg>
